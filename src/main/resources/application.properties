spring.application.name=imobly-gest-api
spring.profiles.active=${ACTIVE_PROFILE:local}

app.config.name=@project.name@
app.config.version=@project.version@

server.port=${SERVER_PORT:8080}

# Banco de dados
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/misuradb}
spring.datasource.username=${DB_USERNAME:mscosta}
spring.datasource.password=${DB_PASSWORD:mscosta}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# O schema e criado e evoluido exclusivamente pelo Flyway. O Hibernate apenas
# valida se as entidades correspondem ao que existe no banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=imobly

# Flyway
spring.flyway.enabled=true
spring.flyway.schemas=imobly
spring.flyway.default-schema=imobly
spring.flyway.create-schemas=true
spring.flyway.locations=classpath:db/migration

# Upload de comprovante
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Documentacao
springdoc.swagger-ui.path=/swagger-ui/index.html
