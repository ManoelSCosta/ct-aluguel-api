# A URL, o usuario e a senha vem do container via @ServiceConnection.
# O Flyway cria o schema imobly e aplica as migracoes; o Hibernate so valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=imobly

spring.flyway.enabled=true
spring.flyway.schemas=imobly
spring.flyway.default-schema=imobly
spring.flyway.create-schemas=true

logging.level.root=WARN
logging.level.com.mscosta.imoblygestapi=INFO
logging.level.org.flywaydb=INFO
